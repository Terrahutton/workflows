name: Unity Build

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated build targets'
        type: string
        required: false
        default: 'StandaloneWindows64,StandaloneOSX'

      project-name:
        description: 'Short project name (used in output filename)'
        type: string
        required: true

      version:
        description: 'Version string (e.g. 0.1.5)'
        type: string
        required: true

      unity-version:
        description: 'Unity version (e.g. 6000.3.11f1). Leave blank to auto-detect.'
        type: string
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare matrix
    runs-on: [self-hosted, macos, unity]

    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - id: set
        run: |
          PLATFORMS="${{ inputs.platforms }}"

          JSON=$(echo "$PLATFORMS" | awk -F',' '{
            printf "["
            for (i = 1; i <= NF; i++) {
              gsub(/^[ \t]+|[ \t]+$/, "", $i)
              if (length($i) > 0) {
                if (i > 1) printf ","
                printf "\"%s\"", $i
              }
            }
            printf "]"
          }')

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Computed matrix: $JSON"

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: prepare
    runs-on: [self-hosted, macos, unity]

    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          repository: terrahutton/workflows
          path: .workflows
          ref: main

      - name: Hide .workflows from git
        run: |
          echo ".workflows/" >> .git/info/exclude

      - name: Compute build name
        id: names
        run: |
          case "${{ matrix.targetPlatform }}" in
            StandaloneWindows64) SUFFIX="Win" ;;
            StandaloneOSX)       SUFFIX="Mac" ;;
            iOS)                 SUFFIX="iOS" ;;
            *)                   SUFFIX="${{ matrix.targetPlatform }}" ;;
          esac

          APP_BASE="${{ inputs.project-name }}-THP-V.${{ inputs.version }}-${SUFFIX}"

          echo "app_base=${APP_BASE}" >> "$GITHUB_OUTPUT"
          echo "Computed app base: ${APP_BASE}"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-
            Library-${{ inputs.project-name }}-

      - name: Load Unity credentials
        run: |
          set -a
          source ~/.config/ci/unity.env
          set +a

          echo "::add-mask::$UNITY_SERIAL"
          echo "UNITY_SERIAL=$UNITY_SERIAL" >> "$GITHUB_ENV"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ steps.names.outputs.app_base }}
          unityVersion: ${{ inputs.unity-version || 'auto' }}
          versioning: None
          skipActivation: true

      - name: List macOS build output
        if: matrix.targetPlatform == 'StandaloneOSX'
        working-directory: build/StandaloneOSX
        run: |
          echo "--- build/StandaloneOSX/ ---"
          ls -la

          echo ""
          echo "--- Found .app bundles ---"
          find . -maxdepth 2 -name "*.app" -type d -print

          
      - name: Normalize macOS app name
        if: matrix.targetPlatform == 'StandaloneOSX'
        working-directory: build/StandaloneOSX
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"
          EXPECTED="${APP_BASE}.app"

          ACTUAL="$(find . -maxdepth 1 -name "*.app" -type d | head -n 1 | sed 's#^\./##')"

          echo "Expected app: $EXPECTED"
          echo "Actual app:   $ACTUAL"

          if [[ -z "$ACTUAL" ]]; then
            echo "::error::No .app bundle found in build/StandaloneOSX"
            ls -la
            exit 1
          fi

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Renaming app bundle:"
            echo "$ACTUAL -> $EXPECTED"
            mv "$ACTUAL" "$EXPECTED"
          fi

      - name: Unlock keychain
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          KEYCHAIN=~/Library/Keychains/login.keychain-db
          KEYCHAIN_PASSWORD="$(cat ~/.keychain-password)"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          echo "==> Available signing identities"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign and notarize macOS build
        if: matrix.targetPlatform == 'StandaloneOSX'
        working-directory: build/StandaloneOSX
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"

          cp "${{ github.workspace }}/.workflows/entitlements/default.entitlements" \
             "${APP_BASE}.entitlements"

          bash "${{ github.workspace }}/.workflows/scripts/sign_and_notarize.sh" "${APP_BASE}"

      - name: Zip Windows build
        if: matrix.targetPlatform == 'StandaloneWindows64'
        working-directory: build/StandaloneWindows64
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"

          ditto -c -k --sequesterRsrc . "${APP_BASE}.zip"
          du -h "${APP_BASE}.zip"

      - name: Upload to builds server
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.targetPlatform }}
          APP_BASE: ${{ steps.names.outputs.app_base }}
        run: |
          set -a
          source ~/.config/ci/unity.env
          set +a

          case "$PLATFORM" in
            StandaloneOSX)
              LOCAL_FILE="build/StandaloneOSX/${APP_BASE}.zip"
              ;;
            StandaloneWindows64)
              LOCAL_FILE="build/StandaloneWindows64/${APP_BASE}.zip"
              ;;
            *)
              echo "::error::Unknown platform $PLATFORM"
              exit 1
              ;;
          esac

          if [[ ! -f "$LOCAL_FILE" ]]; then
            echo "::error::Build output not found at $LOCAL_FILE"
            ls -la "$(dirname "$LOCAL_FILE")" || true
            exit 1
          fi

          DIR_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          REMOTE_DIR="${BUILDS_PATH}/${DIR_NAME}/${VERSION}"

          echo "Uploading $LOCAL_FILE to ${BUILDS_USER}@${BUILDS_HOST}:${REMOTE_DIR}/"
          du -h "$LOCAL_FILE"

          ssh -i "$BUILDS_SSH_KEY" \
            -o StrictHostKeyChecking=accept-new \
            "${BUILDS_USER}@${BUILDS_HOST}" \
            "mkdir -p '${REMOTE_DIR}'"

          rsync -av --progress \
            -e "ssh -i $BUILDS_SSH_KEY -o StrictHostKeyChecking=accept-new" \
            "$LOCAL_FILE" \
            "${BUILDS_USER}@${BUILDS_HOST}:${REMOTE_DIR}/"

          echo ""
          echo "Uploaded to ${REMOTE_DIR}/$(basename "$LOCAL_FILE")"
