name: Unity Build

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated build targets'
        type: string
        required: false
        default: 'StandaloneWindows64,StandaloneOSX'
      project-name:
        description: 'Short project name (used in output filename)'
        type: string
        required: true
      version:
        description: 'Version string (e.g. 0.1.5)'
        type: string
        required: true
      unity-version:
        description: 'Unity version (e.g. 6000.3.11f1). Leave blank to auto-detect.'
        type: string
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare matrix
    runs-on: [self-hosted, macos, unity]
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          PLATFORMS="${{ inputs.platforms }}"
          JSON=$(echo "$PLATFORMS" | awk -F',' '{
            printf "["
            for (i = 1; i <= NF; i++) {
              gsub(/^[ \t]+|[ \t]+$/, "", $i)
              if (length($i) > 0) {
                if (i > 1) printf ","
                printf "\"%s\"", $i
              }
            }
            printf "]"
          }')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Computed matrix: $JSON"

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: prepare
    runs-on: [self-hosted, macos, unity]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          repository: terrahutton/workflows
          path: .workflows
          ref: main

      - name: Hide .workflows from git
        run: |
          echo ".workflows/" >> .git/info/exclude

      - name: Compute build name
        id: names
        run: |
          case "${{ matrix.targetPlatform }}" in
            StandaloneWindows64) SUFFIX="Win" ;;
            StandaloneOSX)       SUFFIX="Mac" ;;
            iOS)                 SUFFIX="iOS" ;;
            *)                   SUFFIX="${{ matrix.targetPlatform }}" ;;
          esac
          APP_BASE="${{ inputs.project-name }}-THP-V.${{ inputs.version }}-${SUFFIX}"
          echo "app_base=${APP_BASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-
            Library-${{ inputs.project-name }}-

      - name: Load Unity credentials
        run: |
          set -a
          source ~/.config/ci/unity.env
          set +a
          echo "::add-mask::$UNITY_SERIAL"
          echo "UNITY_SERIAL=$UNITY_SERIAL" >> "$GITHUB_ENV"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ steps.names.outputs.app_base }}
          unityVersion: ${{ inputs.unity-version || 'auto' }}
          versioning: None
          skipActivation: true

      - name: Unlock keychain
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          security unlock-keychain -p "$(cat ~/.keychain-password)" ~/Library/Keychains/login.keychain-db
          security set-keychain-settings ~/Library/Keychains/login.keychain-db

      - name: Sign and notarize (macOS only)
        if: matrix.targetPlatform == 'StandaloneOSX'
        working-directory: build/StandaloneOSX
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"
          cp "${{ github.workspace }}/.workflows/entitlements/default.entitlements" \
             "${APP_BASE}.entitlements"
          bash "${{ github.workspace }}/.workflows/scripts/sign_and_notarize.sh" "${APP_BASE}"

      - name: Zip Windows build
        if: matrix.targetPlatform == 'StandaloneWindows64'
        working-directory: build/StandaloneWindows64
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"
          ditto -c -k --sequesterRsrc . "${APP_BASE}.zip"
          du -h "${APP_BASE}.zip"

      - name: Upload to builds server
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.targetPlatform }}
          APP_BASE: ${{ steps.names.outputs.app_base }}
        run: |
          set -a
          source ~/.config/ci/unity.env
          set +a

          case "$PLATFORM" in
            StandaloneOSX)       LOCAL_FILE="build/StandaloneOSX/${APP_BASE}.zip" ;;
            StandaloneWindows64) LOCAL_FILE="build/StandaloneWindows64/${APP_BASE}.zip" ;;
            *)                   echo "::error::Unknown platform $PLATFORM"; exit 1 ;;
          esac

          if [[ ! -f "$LOCAL_FILE" ]]; then
            echo "::error::Build output not found at $LOCAL_FILE"
            ls -la "$(dirname "$LOCAL_FILE")" || true
            exit 1
          fi

          DIR_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          REMOTE_DIR="${BUILDS_PATH}/${DIR_NAME}/${VERSION}"

          echo "Uploading $LOCAL_FILE → ${BUILDS_USER}@${BUILDS_HOST}:${REMOTE_DIR}/"
          du -h "$LOCAL_FILE"

          ssh -i "$BUILDS_SSH_KEY" \
              -o StrictHostKeyChecking=accept-new \
              "${BUILDS_USER}@${BUILDS_HOST}" \
              "mkdir -p '${REMOTE_DIR}'"

          rsync -av --progress \
            -e "ssh -i $BUILDS_SSH_KEY -o StrictHostKeyChecking=accept-new" \
            "$LOCAL_FILE" \
            "${BUILDS_USER}@${BUILDS_HOST}:${REMOTE_DIR}/"

          echo ""
          echo "✓ Uploaded to ${REMOTE_DIR}/$(basename "$LOCAL_FILE")"
