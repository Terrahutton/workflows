name: Unity Build

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated build targets'
        type: string
        required: false
        default: 'StandaloneWindows64,StandaloneOSX'
      project-name:
        description: 'Short project name (used in output filename)'
        type: string
        required: true
      version:
        description: 'Version string (e.g. 0.1.5)'
        type: string
        required: true
      unity-version:
        description: 'Unity version (e.g. 6000.3.11f1). Leave blank to auto-detect.'
        type: string
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare matrix
    runs-on: [self-hosted, macos, unity]
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          PLATFORMS="${{ inputs.platforms }}"
          JSON=$(echo "$PLATFORMS" | awk -F',' '{
            printf "["
            for (i = 1; i <= NF; i++) {
              gsub(/^[ \t]+|[ \t]+$/, "", $i)
              if (length($i) > 0) {
                if (i > 1) printf ","
                printf "\"%s\"", $i
              }
            }
            printf "]"
          }')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Computed matrix: $JSON"

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: prepare
    runs-on: [self-hosted, macos, unity]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          repository: terrahutton/workflows
          path: .workflows
          ref: main

      - name: Hide .workflows from git
        run: |
          echo ".workflows/" >> .git/info/exclude

      - name: Compute build name
        id: names
        run: |
          case "${{ matrix.targetPlatform }}" in
            StandaloneWindows64) SUFFIX="Win" ;;
            StandaloneOSX)       SUFFIX="Mac" ;;
            iOS)                 SUFFIX="iOS" ;;
            *)                   SUFFIX="${{ matrix.targetPlatform }}" ;;
          esac
          APP_BASE="${{ inputs.project-name }}-THP-V.${{ inputs.version }}-${SUFFIX}"
          echo "app_base=${APP_BASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ inputs.project-name }}-${{ matrix.targetPlatform }}-
            Library-${{ inputs.project-name }}-

      - name: Load Unity credentials
        run: |
          set -a
          source ~/.config/ci/unity.env
          set +a
          echo "::add-mask::$UNITY_PASSWORD"
          echo "UNITY_EMAIL=$UNITY_EMAIL" >> "$GITHUB_ENV"
          echo "UNITY_PASSWORD=$UNITY_PASSWORD" >> "$GITHUB_ENV"
          echo "UNITY_SERIAL=$UNITY_SERIAL" >> "$GITHUB_ENV"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ steps.names.outputs.app_base }}
          unityVersion: ${{ inputs.unity-version || 'auto' }}

      - name: Unlock keychain
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          security unlock-keychain -p "$(cat ~/.keychain-password)" ~/Library/Keychains/login.keychain-db
          security set-keychain-settings ~/Library/Keychains/login.keychain-db

      - name: Sign and notarize (macOS only)
        if: matrix.targetPlatform == 'StandaloneOSX'
        working-directory: build/StandaloneOSX
        run: |
          APP_BASE="${{ steps.names.outputs.app_base }}"
          cp "${{ github.workspace }}/.workflows/entitlements/default.entitlements" \
             "${APP_BASE}.entitlements"
          bash "${{ github.workspace }}/.workflows/scripts/sign_and_notarize.sh" "${APP_BASE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.app_base }}
          path: |
            build/${{ matrix.targetPlatform }}/${{ steps.names.outputs.app_base }}.zip
            build/${{ matrix.targetPlatform }}/${{ steps.names.outputs.app_base }}.exe
          if-no-files-found: ignore
          retention-days: 14
